<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 670" width="900" height="670" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="900" height="670" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#333"/>
    </marker>
  </defs>

  <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#111">Japanese Workplace Tutor: system architecture</text>

  <g fill="none" stroke="#333" stroke-width="1.4">
    <!-- boxes -->
    <rect x="330" y="60" width="240" height="50" rx="6"/>
    <rect x="150" y="150" width="600" height="56" rx="6"/>
    <rect x="150" y="246" width="600" height="56" rx="6"/>
    <rect x="150" y="342" width="290" height="70" rx="6"/>
    <rect x="460" y="342" width="290" height="70" rx="6"/>
    <rect x="40" y="452" width="250" height="56" rx="6"/>
    <rect x="325" y="452" width="250" height="56" rx="6"/>
    <rect x="610" y="452" width="250" height="56" rx="6"/>
    <rect x="40" y="550" width="250" height="50" rx="6" stroke-dasharray="5 4"/>
    <rect x="325" y="550" width="250" height="50" rx="6" stroke-dasharray="5 4"/>
    <rect x="610" y="550" width="250" height="50" rx="6" stroke-dasharray="5 4"/>
    <!-- arrows -->
    <path d="M450 110V150" marker-end="url(#a)"/>
    <path d="M450 206V246" marker-end="url(#a)"/>
    <path d="M295 302V342" marker-end="url(#a)"/>
    <path d="M605 302V342" marker-end="url(#a)"/>
    <path d="M200 412V432H165V452" marker-end="url(#a)"/>
    <path d="M380 412V452" marker-end="url(#a)"/>
    <path d="M750 274H800V452" marker-end="url(#a)"/>
    <path d="M165 508V550" marker-end="url(#a)"/>
    <path d="M450 508V550" marker-end="url(#a)"/>
    <path d="M735 508V550" marker-end="url(#a)"/>
  </g>

  <g fill="#111" text-anchor="middle">
    <text x="450" y="82" font-size="15" font-weight="bold">Learner</text>
    <text x="450" y="100" font-size="13" fill="#444">web browser</text>

    <text x="450" y="174" font-size="15" font-weight="bold">Streamlit app (screens)</text>
    <text x="450" y="194" font-size="13" fill="#444">Home · Learn · Review · Progress · Presentation</text>

    <text x="450" y="270" font-size="15" font-weight="bold">Services</text>
    <text x="450" y="290" font-size="13" fill="#444">lessons and reviews · progress view · accuracy review</text>

    <text x="295" y="366" font-size="15" font-weight="bold">Features</text>
    <text x="295" y="386" font-size="13" fill="#444">lesson writer · review questions</text>
    <text x="295" y="402" font-size="13" fill="#444">practice coach (feedback only)</text>

    <text x="605" y="366" font-size="15" font-weight="bold">Core rules (code decides, no AI)</text>
    <text x="605" y="386" font-size="13" fill="#444">answer-key check · difficulty check</text>
    <text x="605" y="402" font-size="13" fill="#444">mastery and review schedule · milestones</text>

    <text x="165" y="476" font-size="15" font-weight="bold">AI gateway</text>
    <text x="165" y="496" font-size="13" fill="#444">retry, fallback, public-only check</text>

    <text x="450" y="476" font-size="15" font-weight="bold">Language toolkit</text>
    <text x="450" y="496" font-size="13" fill="#444">readings, JLPT levels, word sets</text>

    <text x="735" y="476" font-size="15" font-weight="bold">Database</text>
    <text x="735" y="496" font-size="13" fill="#444">answers, progress, item names</text>

    <text x="165" y="580" font-size="13">OpenAI API (or offline mock)</text>
    <text x="450" y="572" font-size="13">Sudachi dictionary</text>
    <text x="450" y="590" font-size="13">JLPT and Business word lists</text>
    <text x="735" y="572" font-size="13">SQLite now</text>
    <text x="735" y="590" font-size="13">PostgreSQL in Phase 4</text>

    <text x="450" y="640" font-size="13" fill="#444">The AI only writes lessons. Code checks them and decides what is graded and saved.  Dashed = outside services and data.</text>
  </g>
</svg>
