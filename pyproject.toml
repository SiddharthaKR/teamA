[build-system]
requires = ["setuptools==80.10.2"]
build-backend = "setuptools.build_meta"

[project]
name = "japanese-workplace-tutor"
version = "0.1.0"
description = "Local Japanese workplace learning application"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic==1.19.1",
    "argon2-cffi==25.1.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "python-pptx==1.0.2",
    "requests==2.34.2",
    "SQLAlchemy==2.0.52",
    "streamlit==1.62.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
